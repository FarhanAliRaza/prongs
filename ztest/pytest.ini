# Configuration for ztest's own test suite.
#
# `corpus` is excluded from recursive discovery: it contains intentional
# failures and is only run explicitly (by the integration/parity tests and
# by hand). Explicit paths like `pytest tests/compatibility/corpus` still
# collect it, since norecursedirs only limits recursion.
[pytest]
norecursedirs = corpus testbeds results .zig-cache zig-out
