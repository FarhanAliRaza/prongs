[project]
name = "prongs"
dynamic = ["version"]
description = "Agent-native test runner for Python: runs only the tests a change can affect"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Framework :: Pytest",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Source = "https://github.com/FarhanAliRaza/prongs"

[project.scripts]
prongs = "prongs.__main__:main"

[project.entry-points.pytest11]
prongs = "prongs.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/prongs/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/prongs"]

# starts the recorder in child processes of a recording session (child.py)
[tool.hatch.build.targets.wheel.force-include]
"src/prongs.pth" = "prongs.pth"

[tool.pytest.ini_options]
testpaths = ["tests"]
