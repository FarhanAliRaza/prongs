[project]
name = "fastest"
version = "0.0.1"
description = "Agent-native test runner for Python — PoC"
requires-python = ">=3.12"
dependencies = []

[project.entry-points.pytest11]
fastest = "fastest.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
